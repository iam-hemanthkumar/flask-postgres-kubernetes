apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-deployment
  labels:
    app: flask

spec:
  replicas: 3

  selector:
    matchLabels:
      app: flask-app

  template:
    metadata:
      labels:
        app: flask-app

    spec:
      containers:
        - name: flask-container
          image: app-image:v1
          ports:
            - containerPort: 5000
      
          envFrom:
            - configMapRef:
                name: flask-config

            - secretRef:
                name: flask-secret

